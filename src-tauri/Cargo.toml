[package]
name = "relay-terminal"
version = "0.2.0"
description = "A desktop terminal and connection workspace"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Evilander/relay-terminal"
default-run = "relay-terminal"

[lib]
name = "relay_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "sync", "fs"] }
russh-sftp = "2"
base64 = "0.22"
tempfile = "3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
